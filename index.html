<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CALYOR - Combos & Tienda Online</title>

    <!-- Enlaces y metadatos PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#131921">
    <link rel="apple-touch-icon" href="icon-192.png">

    <!-- GOOGLE ANALYTICS -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-B0T7Z6F4NH"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-B0T7Z6F4NH');
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800;900&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        
        body { 
            background-color: #0f172a; 
            color: #fff; 
            padding-bottom: 90px; 
            overflow-x: hidden;
        }

        /* HEADER CON LOGO Y ESTILO ELEGANTE CALYOR */
        header {
            position: sticky; top: 0; z-index: 100;
            background: linear-gradient(180deg, rgba(10, 15, 26, 0.85) 0%, rgba(15, 23, 42, 0.98) 100%), 
                        url('banner.png') center/cover no-repeat;
            padding: 10px 14px;
            border-bottom: 2px solid #d4af37;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
        }
        
        .header-top {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;
        }

        .brand-container {
            display: flex; align-items: center; gap: 10px; text-decoration: none;
        }

        .header-logo-img {
            height: 38px; width: auto; object-fit: contain; border-radius: 4px;
        }

        .header-title { 
            font-family: 'Cinzel', serif;
            font-size: 1.45rem; font-weight: 900; 
            background: linear-gradient(180deg, #fff3a1 0%, #d4af37 60%, #aa7c11 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1.5px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.8);
        }

        /* BOTÓN DE CARRITO SUPERIOR */
        .cart-top-btn {
            position: relative; background: #1e293b; border: 2px solid #d4af37; color: #d4af37;
            padding: 6px 12px; border-radius: 20px; cursor: pointer; font-size: 1rem;
            display: flex; align-items: center; gap: 6px; transition: all 0.3s ease;
        }
        .cart-badge {
            background: #d4af37; color: #000; border-radius: 12px; padding: 2px 7px;
            font-size: 0.8rem; font-weight: 800;
        }

        .cart-top-btn.glow-active {
            border-color: #00e676 !important;
            color: #00e676 !important;
            box-shadow: 0 0 15px rgba(0, 230, 118, 0.8);
            animation: pulseGlow 1.5s infinite alternate;
        }
        .cart-top-btn.glow-active .cart-badge {
            background: #00e676 !important;
            color: #000 !important;
        }

        @keyframes pulseGlow {
            from { box-shadow: 0 0 10px rgba(0, 230, 118, 0.6); }
            to { box-shadow: 0 0 22px rgba(0, 230, 118, 1); }
        }

        .cart-top-btn.bounce { animation: cartShake 0.5s ease-in-out; }
        @keyframes cartShake {
            0% { transform: scale(1); }
            30% { transform: scale(1.3) rotate(-12deg); }
            60% { transform: scale(1.3) rotate(12deg); }
            100% { transform: scale(1); }
        }

        .search-bar-container {
            display: flex; background: #fff; border-radius: 8px; overflow: hidden; width: 100%;
            border: 2px solid transparent; transition: border-color 0.2s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
        }
        .search-bar-container:focus-within { border-color: #d4af37; }
        .search-input {
            flex: 1; padding: 10px 14px; border: none; outline: none; font-size: 0.95rem; color: #111;
        }
        .search-btn {
            background: #d4af37; border: none; padding: 0 16px; cursor: pointer; font-size: 1.1rem;
        }

        /* CATEGORÍAS DESLIZABLES */
        .categories-nav {
            display: flex; background: #0f172a; overflow-x: auto; white-space: nowrap;
            padding: 0 8px; border-bottom: 1px solid #334155; scrollbar-width: none;
        }
        .categories-nav::-webkit-scrollbar { display: none; }
        
        .cat-btn {
            padding: 12px 16px; background: none; border: none; color: #94a3b8;
            font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: all 0.2s;
            border-bottom: 3px solid transparent;
        }
        .cat-btn.active {
            color: #d4af37; border-bottom: 3px solid #d4af37; background: rgba(212, 175, 55, 0.08);
        }

        .container { padding: 14px 10px; width: 100%; max-width: 1200px; margin: 0 auto; }
        .section { display: none; }
        .section.active { display: block; }

        .alert-banner {
            background: rgba(212, 175, 55, 0.15);
            border: 1px solid #d4af37;
            color: #fef08a;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 14px;
            display: flex; align-items: center; gap: 10px;
        }

        /* CUADRÍCULA DE PRODUCTOS */
        .products-grid {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px;
        }
        @media (min-width: 768px) {
            .products-grid { grid-template-columns: repeat(4, 1fr); gap: 16px; }
        }

        .product-card {
            background: #1e293b; border-radius: 12px; padding: 12px;
            border: 1px solid #334155; display: flex; flex-direction: column;
            justify-content: space-between; box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        .product-img-container {
            width: 100%; height: 130px; border-radius: 8px; overflow: hidden;
            background: #0f172a; margin-bottom: 8px; display: flex; align-items: center; justify-content: center;
        }
        .product-img { width: 100%; height: 100%; object-fit: cover; }

        .product-title {
            font-size: 0.88rem; font-weight: 600; color: #f8fafc; margin-bottom: 4px;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
            height: 2.6em; line-height: 1.3;
        }
        
        .product-desc {
            font-size: 0.75rem; color: #94a3b8; margin-bottom: 6px;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        }

        .product-price { font-size: 1.05rem; font-weight: 800; color: #00e676; margin-bottom: 8px; }

        /* CONTROLES DE CANTIDAD */
        .product-actions { display: flex; flex-direction: column; gap: 6px; }

        .qty-cart-control {
            display: flex; align-items: center; justify-content: space-between;
            background: #0f172a; border-radius: 8px; border: 1px solid #334155; padding: 3px;
        }
        
        .btn-qty-action {
            background: #d4af37; color: #000; border: none; width: 32px; height: 32px;
            border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 1.1rem;
            display: flex; align-items: center; justify-content: center;
        }
        .btn-qty-action:active { transform: scale(0.9); }

        .qty-num-display { font-weight: 800; font-size: 0.95rem; color: #fff; }

        .btn-add-cart-icon {
            background: #d4af37; color: #000; border: none; padding: 8px 10px;
            border-radius: 8px; font-weight: 700; font-size: 0.85rem; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%;
        }
        .btn-add-cart-icon:active { transform: scale(0.95); }

        /* ANIMACIÓN DE VUELO */
        .flying-item {
            position: fixed; z-index: 9999; pointer-events: none;
            width: 50px; height: 50px; border-radius: 50%;
            object-fit: cover; border: 2px solid #d4af37;
            box-shadow: 0 6px 16px rgba(0,0,0,0.6);
            transition: all 1.2s cubic-bezier(0.25, 1, 0.3, 1);
        }

        /* BARRA FLOTANTE PARA "ARMA TU COMBO" */
        .combo-floating-bar {
            position: fixed; bottom: 0; left: 0; width: 100%; background: #0f172a;
            padding: 12px 16px; border-top: 2px solid #d4af37; display: none;
            justify-content: space-between; align-items: center; z-index: 200;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.6);
        }
        .combo-floating-bar.active { display: flex; }

        .combo-bar-info { font-size: 0.85rem; color: #94a3b8; }
        .combo-bar-info strong { color: #d4af37; font-size: 1rem; }

        .btn-combo-check {
            background: #334155; color: #94a3b8; border: none; padding: 10px 14px;
            border-radius: 8px; font-weight: 800; font-size: 0.85rem; cursor: not-allowed;
            transition: all 0.3s ease;
        }
        .btn-combo-check.ready {
            background: #00e676 !important; color: #000 !important; cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 230, 118, 0.8);
        }

        /* MODAL CARRITO */
        .modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none;
            justify-content: center; align-items: center; z-index: 300; padding: 20px;
        }
        .modal-content {
            background: #1e293b; width: 100%; max-width: 440px; padding: 22px;
            border-radius: 16px; border: 1px solid #334155; max-height: 90vh; overflow-y: auto;
        }
        .modal-content h2 { font-size: 1.15rem; margin-bottom: 12px; color: #d4af37; display: flex; flex-direction: column; gap: 4px; }
        
        .cart-summary-list {
            background: #0f172a; border-radius: 8px; padding: 10px; margin-bottom: 15px;
            max-height: 240px; overflow-y: auto; font-size: 0.85rem; border: 1px solid #334155;
        }
        
        .cart-item-row {
            display: flex; justify-content: space-between; align-items: flex-start;
            margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px dashed #334155;
        }
        .cart-item-details { flex: 1; padding-right: 8px; }
        .cart-item-subtext { font-size: 0.75rem; color: #94a3b8; margin-top: 2px; white-space: pre-line; }
        .cart-item-controls { display: flex; align-items: center; gap: 6px; }
        
        .btn-modal-qty {
            background: #334155; color: #fff; border: none; width: 24px; height: 24px;
            border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 0.9rem;
        }
        .btn-modal-delete {
            background: rgba(239, 68, 68, 0.2); color: #ef4444; border: 1px solid #ef4444;
            width: 28px; height: 28px; border-radius: 6px; cursor: pointer; font-size: 0.85rem;
            display: flex; align-items: center; justify-content: center; margin-left: 4px;
        }

        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 0.8rem; color: #94a3b8; margin-bottom: 5px; }
        .form-control {
            width: 100%; padding: 10px; background: #0f172a; border: 1px solid #334155;
            color: #fff; border-radius: 8px; font-size: 0.9rem; outline: none;
        }
        
        .btn-whatsapp-send {
            width: 100%; background: #00e676; color: #000; border: none; padding: 12px;
            border-radius: 10px; font-weight: 800; font-size: 0.95rem; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            box-shadow: 0 4px 15px rgba(0, 230, 118, 0.4); margin-top: 10px;
        }
        .btn-whatsapp-send:disabled {
            background: #334155 !important; color: #94a3b8 !important; cursor: not-allowed; box-shadow: none;
        }

        .modal-btns { display: flex; gap: 10px; margin-top: 10px; }
        .modal-btns button { flex: 1; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .loading { text-align: center; color: #94a3b8; padding: 30px; grid-column: span 2; }
    </style>
</head>
<body>

    <!-- HEADER CON LOGO Y MARCA CALYOR -->
    <header>
        <div class="header-top">
            <a href="#" class="brand-container">
                <img src="logo.png" alt="CALYOR Logo" class="header-logo-img" onerror="this.style.display='none'">
                <span class="header-title">CALYOR</span>
            </a>
            <div class="cart-top-btn" id="cart-target" onclick="abrirModalPedido()">
                🛒 <span id="cart-top-label">Carrito</span>
                <span class="cart-badge" id="cart-top-count">0</span>
            </div>
        </div>
        <div class="search-bar-container">
            <input type="text" id="buscador" class="search-input" placeholder="Buscar productos, combos, medicinas..." oninput="filtrarProductos()">
            <button class="search-btn">🔍</button>
        </div>
    </header>

    <!-- PESTAÑAS DE CATEGORÍAS -->
    <nav class="categories-nav">
        <button class="cat-btn active" onclick="cambiarSeccion('electrodomesticos', this)">⚡ Electrodomésticos</button>
        <button class="cat-btn" onclick="cambiarSeccion('medicamentos', this)">💊 Medicamentos</button>
        <button class="cat-btn" onclick="cambiarSeccion('combos', this)">📦 Combos</button>
        <button class="cat-btn" onclick="cambiarSeccion('armatubox', this)">🛠️ Arma tu combo</button>
        <button class="cat-btn" onclick="cambiarSeccion('miscelaneas', this)">🛒 Miscelánea</button>
        <button class="cat-btn" onclick="cambiarSeccion('otros', this)">📦 Otros</button>
    </nav>

    <div class="container">
        <!-- SECCIONES DE CATÁLOGO -->
        <div id="electrodomesticos" class="section active"><div id="grid-electrodomesticos" class="products-grid"><div class="loading">Cargando electrodomésticos...</div></div></div>
        <div id="medicamentos" class="section"><div id="grid-medicamentos" class="products-grid"><div class="loading">Cargando medicamentos...</div></div></div>
        <div id="combos" class="section"><div id="grid-combos" class="products-grid"><div class="loading">Cargando combos...</div></div></div>
        
        <div id="armatubox" class="section">
            <div class="alert-banner">
                <span>⚠️</span>
                <span><strong>Mínimo de compra:</strong> Selecciona al menos 5 artículos sueltos para empaquetarlos en tu combo.</span>
            </div>
            <div id="grid-armatubox" class="products-grid"><div class="loading">Cargando artículos...</div></div>
        </div>

        <div id="miscelaneas" class="section"><div id="grid-miscelaneas" class="products-grid"><div class="loading">Cargando miscelánea...</div></div></div>
        <div id="otros" class="section"><div id="grid-otros" class="products-grid"><div class="loading">Cargando otros...</div></div></div>
    </div>

    <!-- BARRA FLOTANTE PARA "ARMA TU COMBO" -->
    <div class="combo-floating-bar" id="combo-bar">
        <div class="combo-bar-info">
            🛠️ Borrador combo: <strong id="combo-count-display">0 / 5</strong>
        </div>
        <button class="btn-combo-check" id="btn-combo-finish" onclick="transferirComboAlCarritoPrincipal()">
            Añadir al Carrito 📥
        </button>
    </div>

    <!-- MODAL DE PEDIDO COMPLETO -->
    <div class="modal" id="modalPedido">
        <div class="modal-content">
            <h2>
                <span>🛒 Tu Pedido Total</span>
                <span id="modal-total-header" style="color:#00e676; font-size:0.95rem;"></span>
            </h2>
            
            <div class="cart-summary-list" id="cart-summary-items">
                <!-- Ítems del pedido -->
            </div>

            <div class="form-group"><label>Nombre y Apellidos</label><input type="text" id="cli-nombre" class="form-control" placeholder="Ej: Juan Pérez"></div>
            <div class="form-group"><label>Dirección de Entrega</label><input type="text" id="cli-direccion" class="form-control" placeholder="Calle, reparto..."></div>
            <div class="form-group"><label>Número de Teléfono</label><input type="tel" id="cli-telefono" class="form-control" placeholder="+53..."></div>

            <button class="btn-whatsapp-send" id="btn-modal-send" onclick="enviarWhatsApp()" disabled>
                🚀 Enviar Pedido por WhatsApp
            </button>
            <div class="modal-btns">
                <button style="background:#334155; color:#fff; border:none;" onclick="cerrarModalPedido()">Seguir Comprando</button>
            </div>
        </div>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(() => {}); });
        }

        // ENLACES CSV DIRECTOS DE CADA HOJA DE GOOGLE SHEETS
        const URL_CSV_COMBOS = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT9XIUv_APUqzoTjZRyH8UhAcK1ee2cXWQDz9q7ApKVxu-UdSlOhdfE_TLDRdWUPKoSecHU2l1LZ98w/pub?gid=0&single=true&output=csv';
        const URL_CSV_ARMATUBOX = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT9XIUv_APUqzoTjZRyH8UhAcK1ee2cXWQDz9q7ApKVxu-UdSlOhdfE_TLDRdWUPKoSecHU2l1LZ98w/pub?gid=100465993&single=true&output=csv';
        const URL_CSV_ELECTRO = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT9XIUv_APUqzoTjZRyH8UhAcK1ee2cXWQDz9q7ApKVxu-UdSlOhdfE_TLDRdWUPKoSecHU2l1LZ98w/pub?gid=2127319084&single=true&output=csv';
        const URL_CSV_MEDICINAS = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT9XIUv_APUqzoTjZRyH8UhAcK1ee2cXWQDz9q7ApKVxu-UdSlOhdfE_TLDRdWUPKoSecHU2l1LZ98w/pub?gid=1918521291&single=true&output=csv';
        const URL_CSV_MISCELANEAS = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT9XIUv_APUqzoTjZRyH8UhAcK1ee2cXWQDz9q7ApKVxu-UdSlOhdfE_TLDRdWUPKoSecHU2l1LZ98w/pub?gid=671549051&single=true&output=csv';
        const URL_CSV_OTROS = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT9XIUv_APUqzoTjZRyH8UhAcK1ee2cXWQDz9q7ApKVxu-UdSlOhdfE_TLDRdWUPKoSecHU2l1LZ98w/pub?gid=671549051&single=true&output=csv';

        let datosGlobales = { electrodomesticos: [], medicamentos: [], combos: [], armatubox: [], miscelaneas: [], otros: [] };
        let seccionActual = 'electrodomesticos';
        
        let carritoGlobal = {};
        let carritoComboBorrador = {};
        let contadorCombosArmados = 0;

        function parseCSVLine(text) {
            const result = [];
            let current = '';
            let inQuotes = false;
            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                if (char === '"') {
                    inQuotes = !inQuotes;
                } else if (char === ',' && !inQuotes) {
                    result.push(current.trim().replace(/^"|"$/g, ''));
                    current = '';
                } else {
                    current += char;
                }
            }
            result.push(current.trim().replace(/^"|"$/g, ''));
            return result;
        }

        function parseCSV(text) {
            if (!text || text.trim().length === 0) return [];
            const lines = text.trim().split(/\r?\n/);
            if (lines.length < 2) return [];
            
            const headers = parseCSVLine(lines[0]).map(h => h.toUpperCase());
            return lines.slice(1).map((line, idx) => {
                if (!line.trim()) return null;
                const values = parseCSVLine(line);
                let obj = { ID: 'item_' + idx };
                headers.forEach((h, i) => { obj[h] = values[i] || ''; });
                return obj;
            }).filter(Boolean);
        }

        async function fetchCSVConBackup(url, claveLocal) {
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error("Error de red");
                const text = await response.text();
                if (text && text.trim().length > 0) {
                    localStorage.setItem(claveLocal, text); // Guarda respaldo fijo en el teléfono
                    return parseCSV(text);
                }
            } catch (e) {
                console.warn('Cargando respaldo offline para:', claveLocal);
            }
            // Si está offline o la red falla, recupera la copia local previa
            const copiaLocal = localStorage.getItem(claveLocal);
            return copiaLocal ? parseCSV(copiaLocal) : [];
        }

        async function cargarDatos() {
            datosGlobales.electrodomesticos = await fetchCSVConBackup(URL_CSV_ELECTRO, 'cache_electro');
            datosGlobales.medicamentos = await fetchCSVConBackup(URL_CSV_MEDICINAS, 'cache_medicinas');
            datosGlobales.combos = await fetchCSVConBackup(URL_CSV_COMBOS, 'cache_combos');
            datosGlobales.armatubox = await fetchCSVConBackup(URL_CSV_ARMATUBOX, 'cache_armatubox');
            datosGlobales.miscelaneas = await fetchCSVConBackup(URL_CSV_MISCELANEAS, 'cache_miscelaneas');
            datosGlobales.otros = await fetchCSVConBackup(URL_CSV_OTROS, 'cache_otros');

            renderizarSeccion(seccionActual);
        }

        function cambiarSeccion(seccionId, btn) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            
            document.getElementById(seccionId).classList.add('active');
            btn.classList.add('active');
            
            seccionActual = seccionId;

            const comboBar = document.getElementById('combo-bar');
            if (seccionActual === 'armatubox') {
                comboBar.classList.add('active');
            } else {
                comboBar.classList.remove('active');
            }

            actualizarUI();
            renderizarSeccion(seccionId);
        }

        function formatearPrecio(precio, moneda) {
            const m = (moneda || 'USD').toUpperCase().trim();
            if (m === 'CUP') {
                return `${Math.round(precio).toLocaleString()} CUP`;
            } else {
                return `$${precio.toFixed(2)} USD`;
            }
        }

        function renderizarSeccion(seccionId) {
            const container = document.getElementById(`grid-${seccionId}`);
            const lista = datosGlobales[seccionId] || [];

            if (lista.length === 0) {
                container.innerHTML = '<p class="loading">No hay productos disponibles en esta sección.</p>';
                return;
            }

            container.innerHTML = lista.map((item, i) => {
                const id = item.ID || `${seccionId}_${i}`;
                const nombre = item.NOMBRE || 'Producto';
                let rawDesc = item.DETALLES || item.DESC || '';
                const desc = rawDesc.replaceAll(',', '\n').replaceAll('|', '\n');
                const precio = parseFloat(item.PRECIO || 0);
                const moneda = (item.MONEDA || 'USD').toUpperCase().trim();
                const imgUrl = item.IMAGEN || item.FOTO || '';
                const imgTag = imgUrl ? `<img src="${imgUrl}" class="product-img" id="img-${id}" alt="${nombre}" onerror="this.parentElement.style.display='none'">` : '';

                let enCarrito = 0;
                if (seccionId === 'armatubox') {
                    enCarrito = carritoComboBorrador[id] ? carritoComboBorrador[id].cantidad : 0;
                } else {
                    enCarrito = carritoGlobal[id] ? carritoGlobal[id].cantidad : 0;
                }

                return `
                    <div class="product-card">
                        <div>
                            <div class="product-img-container">${imgTag}</div>
                            <div class="product-title">${nombre}</div>
                            ${desc ? `<div class="product-desc">${desc}</div>` : ''}
                            <div class="product-price">${formatearPrecio(precio, moneda)}</div>
                        </div>
                        <div class="product-actions">
                            ${enCarrito === 0 ? 
                                `<button class="btn-add-cart-icon" onclick="cambiarCant('${seccionId}', '${id}', '${nombre}', ${precio}, '${moneda}', 1, event)">
                                    🛒 Agregar
                                 </button>` :
                                `<div class="qty-cart-control">
                                    <button class="btn-qty-action" onclick="cambiarCant('${seccionId}', '${id}', '${nombre}', ${precio}, '${moneda}', -1, event)">-</button>
                                    <span class="qty-num-display">🛒 ${enCarrito}</span>
                                    <button class="btn-qty-action" onclick="cambiarCant('${seccionId}', '${id}', '${nombre}', ${precio}, '${moneda}', 1, event)">+</button>
                                 </div>`
                            }
                        </div>
                    </div>
                `;
            }).join('');
        }

        function cambiarCant(seccion, id, nombre, precio, moneda, cambio, event) {
            if (seccion === 'armatubox') {
                if (!carritoComboBorrador[id]) {
                    carritoComboBorrador[id] = { nombre, precio, moneda, cantidad: 0 };
                }
                carritoComboBorrador[id].cantidad += cambio;

                if (cambio > 0 && event) {
                    animarVueloHaciaTarget(id, 'btn-combo-finish', event);
                }

                if (carritoComboBorrador[id].cantidad <= 0) {
                    delete carritoComboBorrador[id];
                }
            } else {
                if (!carritoGlobal[id]) {
                    carritoGlobal[id] = { nombre, precio, moneda, cantidad: 0, esComboArmado: false };
                }
                carritoGlobal[id].cantidad += cambio;

                if (cambio > 0 && event) {
                    animarVueloHaciaTarget(id, 'cart-target', event);
                }

                if (carritoGlobal[id].cantidad <= 0) {
                    delete carritoGlobal[id];
                }
            }

            renderizarSeccion(seccion);
            actualizarUI();
        }

        function animarVueloHaciaTarget(id, targetId, event) {
            const originImg = document.getElementById(`img-${id}`);
            const targetEl = document.getElementById(targetId);

            if (!targetEl) return;

            let startX, startY;
            if (originImg && originImg.offsetParent !== null) {
                const rect = originImg.getBoundingClientRect();
                startX = rect.left + rect.width / 2;
                startY = rect.top + rect.height / 2;
            } else if (event) {
                startX = event.clientX;
                startY = event.clientY;
            } else { return; }

            const targetRect = targetEl.getBoundingClientRect();
            const targetX = targetRect.left + targetRect.width / 2;
            const targetY = targetRect.top + targetRect.height / 2;

            const flyer = document.createElement('img');
            flyer.src = originImg ? originImg.src : 'logo.png';
            flyer.className = 'flying-item';
            flyer.style.left = `${startX - 25}px`;
            flyer.style.top = `${startY - 25}px`;

            document.body.appendChild(flyer);

            requestAnimationFrame(() => {
                flyer.style.left = `${targetX - 12}px`;
                flyer.style.top = `${targetY - 12}px`;
                flyer.style.width = '22px';
                flyer.style.height = '22px';
                flyer.style.opacity = '0.3';
                flyer.style.transform = 'scale(0.3) rotate(720deg)';
            });

            setTimeout(() => {
                flyer.remove();
                targetEl.classList.add('bounce');
                setTimeout(() => targetEl.classList.remove('bounce'), 500);
            }, 1200);
        }

        function transferirComboAlCarritoPrincipal() {
            let totalItemsBorrador = 0;
            let totalUSD = 0, totalCUP = 0;
            let listaDetallada = [];

            for (let id in carritoComboBorrador) {
                const item = carritoComboBorrador[id];
                totalItemsBorrador += item.cantidad;
                const sub = item.precio * item.cantidad;
                
                if (item.moneda === 'CUP') {
                    totalCUP += sub;
                } else {
                    totalUSD += sub;
                }
                listaDetallada.push(`• ${item.nombre} (x${item.cantidad})`);
            }

            if (totalItemsBorrador < 5) return;

            contadorCombosArmados++;
            const comboId = `combo_armado_${contadorCombosArmados}`;

            let textoPrecioCombo = [];
            if (totalUSD > 0) textoPrecioCombo.push(`$${totalUSD.toFixed(2)} USD`);
            if (totalCUP > 0) textoPrecioCombo.push(`${Math.round(totalCUP).toLocaleString()} CUP`);

            carritoGlobal[comboId] = {
                nombre: `📦 Combo Personalizado #${contadorCombosArmados} (${totalItemsBorrador} art.)`,
                detalles: listaDetallada.join('\n'),
                precioUSD: totalUSD,
                precioCUP: totalCUP,
                textoPrecio: textoPrecioCombo.join(' + '),
                cantidad: 1,
                esComboArmado: true
            };

            carritoComboBorrador = {};

            const cartBtn = document.getElementById('cart-target');
            cartBtn.classList.add('bounce');
            setTimeout(() => cartBtn.classList.remove('bounce'), 500);

            renderizarSeccion('armatubox');
            actualizarUI();
            alert(`¡Tu Combo Personalizado (${totalItemsBorrador} artículos) fue añadido al Carrito Principal! 🛒`);
        }

        function calcularTotalesCarrito() {
            let totalUSD = 0, totalCUP = 0, totalItems = 0;
            for (let id in carritoGlobal) {
                const item = carritoGlobal[id];
                totalItems += item.cantidad;

                if (item.esComboArmado) {
                    totalUSD += (item.precioUSD || 0) * item.cantidad;
                    totalCUP += (item.precioCUP || 0) * item.cantidad;
                } else {
                    const sub = item.precio * item.cantidad;
                    if (item.moneda === 'CUP') {
                        totalCUP += sub;
                    } else {
                        totalUSD += sub;
                    }
                }
            }
            return { totalUSD, totalCUP, totalItems };
        }

        function actualizarUI() {
            const { totalUSD, totalCUP, totalItems } = calcularTotalesCarrito();

            let itemsBorrador = 0;
            for (let id in carritoComboBorrador) {
                itemsBorrador += carritoComboBorrador[id].cantidad;
            }

            const cartBtn = document.getElementById('cart-target');
            const cartBadge = document.getElementById('cart-top-count');
            const btnModalSend = document.getElementById('btn-modal-send');
            const comboDisplay = document.getElementById('combo-count-display');
            const comboFinishBtn = document.getElementById('btn-combo-finish');

            cartBadge.innerText = totalItems;
            if (totalItems > 0) {
                cartBtn.classList.add('glow-active');
                btnModalSend.disabled = false;
            } else {
                cartBtn.classList.remove('glow-active');
                btnModalSend.disabled = true;
            }

            comboDisplay.innerText = `${itemsBorrador} / 5`;
            if (itemsBorrador >= 5) {
                comboFinishBtn.classList.add('ready');
                comboFinishBtn.innerText = "Añadir al Carrito Principal 📥";
            } else {
                comboFinishBtn.classList.remove('ready');
                comboFinishBtn.innerText = `Faltan ${5 - itemsBorrador} art.`;
            }

            let textoTotalesHeader = [];
            if (totalUSD > 0) textoTotalesHeader.push(`$${totalUSD.toFixed(2)} USD`);
            if (totalCUP > 0) textoTotalesHeader.push(`${Math.round(totalCUP).toLocaleString()} CUP`);

            document.getElementById('modal-total-header').innerText = textoTotalesHeader.length > 0 ? textoTotalesHeader.join(' + ') : '$0.00 USD';
        }

        function abrirModalPedido() {
            renderizarItemsModal();
            document.getElementById('modalPedido').style.display = 'flex';
        }

        function renderizarItemsModal() {
            const summaryContainer = document.getElementById('cart-summary-items');
            let html = '';

            for (let id in carritoGlobal) {
                let item = carritoGlobal[id];

                if (item.esComboArmado) {
                    html += `
                        <div class="cart-item-row">
                            <div class="cart-item-details">
                                <strong style="color:#d4af37;">${item.nombre}</strong><br>
                                <div class="cart-item-subtext">${item.detalles}</div>
                                <span style="color:#00e676; font-weight:bold;">${item.textoPrecio}</span>
                            </div>
                            <div class="cart-item-controls">
                                <button class="btn-modal-delete" onclick="eliminarEnModal('${id}')" title="Eliminar este combo completo">🗑️</button>
                            </div>
                        </div>
                    `;
                } else {
                    let sub = item.precio * item.cantidad;
                    html += `
                        <div class="cart-item-row">
                            <div class="cart-item-details">
                                <strong>${item.nombre}</strong><br>
                                <span style="color:#00e676;">${formatearPrecio(sub, item.moneda)}</span> (${formatearPrecio(item.precio, item.moneda)} c/u)
                            </div>
                            <div class="cart-item-controls">
                                <button class="btn-modal-qty" onclick="modificarEnModal('${id}', -1)">-</button>
                                <span style="font-weight:bold; min-width:18px; text-align:center;">${item.cantidad}</span>
                                <button class="btn-modal-qty" onclick="modificarEnModal('${id}', 1)">+</button>
                                <button class="btn-modal-delete" onclick="eliminarEnModal('${id}')" title="Eliminar producto">🗑️</button>
                            </div>
                        </div>
                    `;
                }
            }

            if (html === '') {
                html = '<p style="text-align:center; color:#94a3b8; padding: 10px;">Tu carrito está vacío.</p>';
            }

            summaryContainer.innerHTML = html;
            actualizarUI();
        }

        function modificarEnModal(id, cambio) {
            if (carritoGlobal[id]) {
                carritoGlobal[id].cantidad += cambio;
                if (carritoGlobal[id].cantidad <= 0) {
                    delete carritoGlobal[id];
                }
            }
            renderizarSeccion(seccionActual);
            actualizarUI();
            renderizarItemsModal();
        }

        function eliminarEnModal(id) {
            delete carritoGlobal[id];
            renderizarSeccion(seccionActual);
            actualizarUI();
            renderizarItemsModal();
        }

        function cerrarModalPedido() { document.getElementById('modalPedido').style.display = 'none'; }

        function enviarWhatsApp() {
            const nombre = document.getElementById('cli-nombre').value.trim();
            const direccion = document.getElementById('cli-direccion').value.trim();
            const telefono = document.getElementById('cli-telefono').value.trim();

            if (!nombre || !direccion || !telefono) {
                alert('Por favor completa todos los datos de entrega.');
                return;
            }

            let msg = `*¡NUEVO PEDIDO - CALYOR!* 🛒\n\n`;
            msg += `👤 *Cliente:* ${nombre}\n`;
            msg += `📍 *Dirección:* ${direccion}\n`;
            msg += `📞 *Teléfono:* ${telefono}\n\n`;
            msg += `📦 *Detalle del Pedido:* \n`;

            let totalUSD = 0, totalCUP = 0;

            for(let id in carritoGlobal) {
                let item = carritoGlobal[id];
                
                if (item.esComboArmado) {
                    msg += `\n*${item.nombre}* - ${item.textoPrecio}\n${item.detalles}\n`;
                    totalUSD += (item.precioUSD || 0) * item.cantidad;
                    totalCUP += (item.precioCUP || 0) * item.cantidad;
                } else {
                    let sub = item.precio * item.cantidad;
                    msg += `- ${item.nombre} x${item.cantidad} (${formatearPrecio(sub, item.moneda)})\n`;
                    if (item.moneda === 'CUP') totalCUP += sub;
                    else totalUSD += sub;
                }
            }

            msg += `\n💰 *Total a pagar:* `;
            let resTotales = [];
            if (totalUSD > 0) resTotales.push(`$${totalUSD.toFixed(2)} USD`);
            if (totalCUP > 0) resTotales.push(`${Math.round(totalCUP).toLocaleString()} CUP`);
            msg += resTotales.join(' + ');

            const url = `https://wa.me/+5350306150?text=${encodeURIComponent(msg)}`;
            window.open(url, '_blank');
            cerrarModalPedido();
        }

        function filtrarProductos() {
            const query = document.getElementById('buscador').value.toLowerCase();
            const lista = datosGlobales[seccionActual] || [];
            const container = document.getElementById(`grid-${seccionActual}`);

            const filtrados = lista.filter(item => (item.NOMBRE || '').toLowerCase().includes(query) || (item.DESC || '').toLowerCase().includes(query));

            if (filtrados.length === 0) {
                container.innerHTML = '<p class="loading">No se encontraron productos.</p>';
                return;
            }

            container.innerHTML = filtrados.map((item, i) => {
                const id = item.ID || `search_${i}`;
                const nombre = item.NOMBRE || 'Producto';
                const precio = parseFloat(item.PRECIO || 0);
                const moneda = (item.MONEDA || 'USD').toUpperCase().trim();
                const imgUrl = item.IMAGEN || item.FOTO || '';
                const imgTag = imgUrl ? `<img src="${imgUrl}" class="product-img" id="img-${id}" alt="${nombre}" onerror="this.parentElement.style.display='none'">` : '';

                let enCarrito = 0;
                if (seccionActual === 'armatubox') {
                    enCarrito = carritoComboBorrador[id] ? carritoComboBorrador[id].cantidad : 0;
                } else {
                    enCarrito = carritoGlobal[id] ? carritoGlobal[id].cantidad : 0;
                }

                return `
                    <div class="product-card">
                        <div>
                            <div class="product-img-container">${imgTag}</div>
                            <div class="product-title">${nombre}</div>
                            <div class="product-price">${formatearPrecio(precio, moneda)}</div>
                        </div>
                        <div class="product-actions">
                            ${enCarrito === 0 ? 
                                `<button class="btn-add-cart-icon" onclick="cambiarCant('${seccionActual}', '${id}', '${nombre}', ${precio}, '${moneda}', 1, event)">
                                    🛒 Agregar
                                 </button>` :
                                `<div class="qty-cart-control">
                                    <button class="btn-qty-action" onclick="cambiarCant('${seccionActual}', '${id}', '${nombre}', ${precio}, '${moneda}', -1, event)">-</button>
                                    <span class="qty-num-display">🛒 ${enCarrito}</span>
                                    <button class="btn-qty-action" onclick="cambiarCant('${seccionActual}', '${id}', '${nombre}', ${precio}, '${moneda}', 1, event)">+</button>
                                 </div>`
                            }
                        </div>
                    </div>
                `;
            }).join('');
        }

        cargarDatos();
    </script>
</body>
